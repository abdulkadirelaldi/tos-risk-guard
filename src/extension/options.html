<!doctype html>
<html lang="tr">
<head>
  <meta charset="utf-8">
  <title>ToS Risk Guard · Ayarlar</title>
  <style>
    body { font: 14px/1.5 system-ui, sans-serif; max-width: 560px; margin: 40px auto; padding: 0 16px; color: #1f2328; }
    label { display: block; font-weight: 600; margin-top: 16px; }
    input { width: 100%; padding: 8px; font: inherit; border: 1px solid #d0d7de; border-radius: 6px; }
    button { margin-top: 16px; padding: 8px 16px; font: inherit; border-radius: 6px; border: 1px solid #0b57d0; background: #0b57d0; color: #fff; cursor: pointer; }
    .note { background: #eef3fd; border: 1px solid #c6d6f7; padding: 10px 12px; border-radius: 8px; font-size: 13px; }
    #status { margin-left: 10px; color: #2e7d32; }
  </style>
</head>
<body>
  <h1>ToS Risk Guard</h1>
  <p class="note"><b>Bu uygulama hukuki tavsiye vermez.</b> Anahtarınız yalnızca bu tarayıcıda (<code>chrome.storage.local</code>) saklanır, yalnızca eklentinin arka plan betiği tarafından okunur ve yalnızca Google Gemini API'ye gönderilir. Ziyaret ettiğiniz sayfalar anahtara erişemez.</p>
  <label for="key">Gemini API anahtarı</label>
  <input id="key" type="password" autocomplete="off" placeholder="AIza…">
  <label for="model">Model</label>
  <input id="model" type="text" placeholder="gemini-3.5-flash-lite">
  <button id="save" type="button">Kaydet</button><span id="status"></span>
  <script src="options.js"></script>
</body>
</html>
